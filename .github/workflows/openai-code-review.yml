name: OpenAI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - devin-develop
      - master

jobs:
  openai-code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Skip this job if the PR author is devin-ai-integration
    if: github.event.pull_request.user.login != 'devin-ai-integration[bot]'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: OpenAI Code Review
        uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGUAGE: English
          MODEL: gpt-4-turbo
          IGNORED_FILES: "**/*.md,**/*.mdx,**/README.md,**/LICENSE.md,**/CONTRIBUTING.md"
          PROMPT: |
            You are a senior React/TypeScript/Next.js (App Router) reviewer. Report ONLY genuine, high-confidence problems (bugs, correctness, real risks). Be terse.

            Rules:
            1. If nothing is genuinely wrong, reply exactly: "✅ No issues found."
            2. Report only real defects. Do NOT praise, summarize, or restate what the code does.
            3. Do NOT flag style, formatting, naming, or deliberate config/tooling choices (compiler flags, preview deps, path aliases) unless they cause an actual bug.
            4. No invented, speculative, or "consider" nitpicks. If unsure, stay silent.
            5. Per issue: one short line — the problem + the fix. No code blocks unless a one-liner is essential. No doc links needed.
            6. Keep each comment under 200 characters.
            7. Ignore security.
